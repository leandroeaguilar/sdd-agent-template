# Verificación del repo en cada PR y en cada push a la rama principal — el
# mismo gate que corre en tu máquina, pero del lado del servidor.
#
# Por qué también en push: en REPO_MODE=solo no hay PRs, se commitea directo a
# main. Solo con `pull_request` este workflow no corría nunca en el modo por
# defecto, y el badge del README mostraba la última corrida manual.
#
# Por qué existe: los hooks de .githooks/ corren en el clon de quien commitea,
# y solo si esa persona corrió `bash setup.sh` (core.hooksPath es config LOCAL:
# no viaja con el repo). Con más de una persona eso no es una garantía, es una
# esperanza — y `--no-verify` la saltea en un teclazo. Acá el chequeo no depende
# de la máquina de nadie.
#
# Qué bloquea y qué no (deliberado):
#   secret-scan  → BLOQUEA. Un secreto en una rama publicada ya se filtró.
#   tests del gate SDD → BLOQUEAN. Prueban el hook (sdd-gate.test.sh), no el
#                  PR: un gate roto deja pasar lo que debía frenar y no avisa.
#   lint/tests   → BLOQUEAN una vez cableados en el kickoff (README, «Cablear lint y tests»).
#                  Hasta entonces el paso avisa en el resumen en vez de fallar:
#                  un repo recién nacido no tiene suite que correr.
#   bitácora     → informa. El handoff es una convención de agentes, no algo
#                  que tenga sentido imponerle a un humano que arregla un typo.
#   gate SDD     → informa. La puerta de aprobación de una spec es un acuerdo
#                  entre el dueño del repo y sus agentes; cuando el PR existe,
#                  el humano ya la vio. El control real es el pre-commit.

name: verify

on:
  pull_request:
  push:
    # La rama principal de repo.conf. Un trigger no puede leer ese archivo:
    # si tu rama principal no se llama main, cambiala acá también.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # los verificadores comparan contra la base del PR

      - name: Rango a verificar
        id: range
        env:
          # Por `env:` y no interpolado en el script: hardening estándar de
          # Actions (un título de rama malicioso no se ejecuta como shell).
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # OJO con `[ cond ] && x=y`: los `run:` corren con `bash -eo pipefail`,
          # así que cuando la condición es FALSA la lista devuelve 1 y el paso
          # falla — justo en el caso normal. Va con if/then, no con `&&`.
          BASE="$PR_BASE"; HEAD="$PR_HEAD"
          # push: desde el commit que la rama tenía antes del push, para cubrir
          # todos los commits que trae. Si `before` son 40 ceros (rama nueva) o
          # quedó fuera del historial (force-push), se cae al caso de abajo.
          if [ -z "$BASE" ] && [ -n "$PUSH_BEFORE" ] \
             && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          fi
          # workflow_dispatch (o push sin `before` usable): el último commit.
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          if [ -z "$HEAD" ]; then HEAD="$(git rev-parse HEAD)"; fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Verificando $BASE...$HEAD"

      # ── BLOQUEANTE ───────────────────────────────────────────────────────────
      - name: Secretos (bloquea)
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: bash .claude/hooks/secret-scan.sh --range "$BASE" "$HEAD"

      - name: Tests del gate SDD (bloquea)
        run: |
          # El gate es la puerta de aprobación: un PR que lo rompa no puede salir
          # en verde. Sin este paso los tests solo corrían si alguien se acordaba.
          # El banco sale 0 si no encuentra python ("no corre"), así que acá se
          # exige: un check verde que no corrió nada es peor que uno rojo.
          if ! command -v python >/dev/null 2>&1 && ! command -v python3 >/dev/null 2>&1; then
            echo "::error::falta python en el runner: los tests del gate SDD no pueden correr"
            exit 1
          fi
          bash .claude/hooks/sdd-gate.test.sh

      # ── STACK ────────────────────────────────────────────────────────────────
      # Cablear en el kickoff (README, «Cablear lint y tests»), junto con .githooks/pre-commit.
      # Descomentar el setup del lenguaje y reemplazar los comandos de abajo.
      #
      # - uses: actions/setup-node@v4
      #   with: { node-version: '22', cache: 'npm' }
      # - run: npm ci
      #
      # - uses: actions/setup-python@v5
      #   with: { python-version: '3.12' }
      # - run: pip install -e ".[dev]"
      - name: Lint y tests
        run: |
          # Reemplazar este bloque entero por los comandos reales del stack
          # (`npm run lint && npm test`, `ruff check . && pytest`, …).
          # Mientras no haya stack, el paso avisa en vez de fallar.
          {
            echo "### Lint y tests"
            echo "⚠️ Sin cablear todavía — este cambio **no corrió ninguna prueba**."
            echo "Cablealos en \`.github/workflows/verify.yml\` y en \`.githooks/pre-commit\`"
            echo "(README, kickoff «Cablear lint y tests»). Hasta entonces solo bloquean el secret-scan y los tests del gate SDD."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── INFORMATIVO ──────────────────────────────────────────────────────────
      - name: Flujo SDD
        continue-on-error: true
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          # El mismo gate del pre-commit, en modo --range. Informa en vez de
          # bloquear (ver cabecera). Inerte si el repo no tiene feature_list.json.
          #
          # Commit por commit, no el rango entero: el gate razona como el
          # pre-commit, que ve un commit por vez. Con el rango completo, un PR
          # o un push que trae el commit de aprobación y después el de código
          # —justo el flujo correcto— se leía como «aprobación y código en el
          # mismo commit». Los merges y el commit raíz se saltean: no tienen un
          # único padre contra el cual comparar.
          REPORTE=""
          for c in $(git rev-list --reverse --no-merges "$BASE..$HEAD"); do
            if ! git rev-parse -q --verify "$c^" >/dev/null; then continue; fi
            if ! OUT="$(bash .claude/hooks/sdd-gate.sh --range "$c^" "$c" 2>&1)"; then
              REPORTE="$REPORTE$(printf '\n#### %s\n```\n%s\n```' "$(git log -1 --format='%h %s' "$c")" "$OUT")"
            fi
          done
          if [ -n "$REPORTE" ]; then
            { echo "### Flujo SDD"; printf '%s\n' "$REPORTE"; } >> "$GITHUB_STEP_SUMMARY"
            echo "$REPORTE"
          fi

      - name: Handoff en la bitácora
        continue-on-error: true
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          # `-c core.quotepath=false`: sin esto git escapa las rutas no-ASCII
          # (`docs/Migraci\303\263n.md`) y los nombres dejan de resolver.
          CHANGED="$(git -c core.quotepath=false diff --name-only "$BASE...$HEAD")"
          if echo "$CHANGED" | grep -q '^docs/BITACORA.md$'; then
            echo "- handoff registrado en la bitácora" >> "$GITHUB_STEP_SUMMARY"
          elif echo "$CHANGED" | grep -qE '^(src|specs)/'; then
            {
              echo "### Bitácora"
              echo "Este cambio toca \`src/\` o \`specs/\` pero no agrega entrada en"
              echo "\`docs/BITACORA.md\`. Si lo hizo un agente, falta su handoff."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
